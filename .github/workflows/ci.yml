name: PR Build & Test

on:
  push:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise (if not globally available)
        run: |
          if ! command -v mise &> /dev/null; then
            curl https://mise.run | bash
          fi
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/bin:$PATH"
          mise --version

      - name: Setup mise cache
        uses: actions/cache@v3
        with:
          path: ~/.local/share/mise/installs
          key: ${{ runner.os }}-mise-${{ hashFiles('.mise.toml') }}

      - name: Install tools via mise
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/bin:$PATH"
          mise install

      - name: Install dependencies
        run: mise exec ruby -- bundle install --jobs 4 --retry 3

      - name: Run tests with fastlane scan
        run: mise exec ruby -- bundle exec fastlane build